auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    s3:
      bucketnames: __BUCKET__
      region: us-east-1

schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

# Short idle/max age so un-flushed chunks (lost when the single obs task rolls) cover only minutes.
ingester:
  chunk_idle_period: 1m
  max_chunk_age: 5m

limits_config:
  retention_period: 72h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: s3

analytics:
  reporting_enabled: false
