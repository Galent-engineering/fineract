# FireLens custom config for the Fineract container (tag fineract-firelens-*).
[OUTPUT]
    Name              cloudwatch_logs
    Match             fineract-firelens-*
    region            us-east-1
    log_group_name    /harness/fineract
    log_stream_prefix fineract-
    auto_create_group Off

[OUTPUT]
    Name        loki
    Match       fineract-firelens-*
    host        loki.harness.local
    port        3100
    labels      app=fineract
    line_format json
