# ADOT collector sidecar on the Fineract task. Delivered through AOT_CONFIG_CONTENT.
# The AMP endpoint placeholder below is replaced at synth (workspace endpoint, ends with a slash).
extensions:
  sigv4auth:
    region: us-east-1
    service: aps

receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: fineract
          scrape_interval: 30s
          metrics_path: /fineract-provider/actuator/prometheus
          static_configs:
            - targets: ['localhost:8080']
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 10s

exporters:
  prometheusremotewrite:
    endpoint: __AMP_ENDPOINT__api/v1/remote_write
    auth:
      authenticator: sigv4auth
  awsxray:
    region: us-east-1
  otlphttp/tempo:
    endpoint: http://tempo.harness.local:4318

service:
  extensions: [sigv4auth]
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [batch]
      exporters: [prometheusremotewrite]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [awsxray, otlphttp/tempo]
