# Auth front for Tempo and Loki. The ALB forwards /tempo/* and /loki/* here; the trailing
# slash on proxy_pass strips exactly the first path segment:
#   /tempo/api/search          -> :3200/api/search
#   /loki/loki/api/v1/labels   -> :3100/loki/api/v1/labels
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  access_log /dev/stdout;

  server {
    listen 8080;

    location = /healthz {
      access_log off;
      return 200 "ok";
    }

    location /tempo/ {
      auth_basic "harness observability";
      auth_basic_user_file /cfg/htpasswd;
      proxy_pass http://127.0.0.1:3200/;
    }

    location /loki/ {
      auth_basic "harness observability";
      auth_basic_user_file /cfg/htpasswd;
      proxy_pass http://127.0.0.1:3100/;
    }

    location / {
      return 404;
    }
  }
}
