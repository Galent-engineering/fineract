# Read-only, authenticated front for Tempo and Loki. The ALB forwards /tempo/* and /loki/* here.
# Basic auth applies to everything except /healthz. Only an allowlist of READ endpoints is proxied
# (GET/HEAD; Loki also POST on query, query_range, series, which Grafana-style clients use for long
# queries); everything else (push, delete, flush, shutdown, config, ring, admin, metrics) is 403.
# Prefix stripping:
#   /tempo/api/search          -> :3200/api/search
#   /loki/loki/api/v1/labels   -> :3100/loki/api/v1/labels
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  access_log /dev/stdout;

  server {
    listen 8080;

    auth_basic "harness observability";
    auth_basic_user_file /cfg/htpasswd;

    location = /healthz {
      auth_basic off;
      access_log off;
      return 200 "ok";
    }

    # Tempo reads: echo, search, tag names/values, trace by id.
    location ~ ^/tempo/api/(echo|search|search/tags|search/tag/[^/]+/values|v2/search/tags|v2/search/tag/[^/]+/values|traces/[^/]+|v2/traces/[^/]+)$ {
      limit_except GET HEAD {
        deny all;
      }
      rewrite ^/tempo/(.*)$ /$1 break;
      proxy_pass http://127.0.0.1:3200;
    }

    # Loki reads that may also be POSTed (form-encoded queries).
    location ~ ^/loki/loki/api/v1/(query|query_range|series)$ {
      limit_except GET HEAD POST {
        deny all;
      }
      rewrite ^/loki/(.*)$ /$1 break;
      proxy_pass http://127.0.0.1:3100;
    }

    # Loki GET/HEAD-only reads.
    location ~ ^/loki/loki/api/v1/(labels|label/[^/]+/values|index/stats)$ {
      limit_except GET HEAD {
        deny all;
      }
      rewrite ^/loki/(.*)$ /$1 break;
      proxy_pass http://127.0.0.1:3100;
    }

    location / {
      return 403;
    }
  }
}
