[project]
name = "harness-traffic"
version = "0.1.0"
description = "Seed data and synthetic traffic for the reliability harness (Fineract)"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "boto3>=1.34"]

[dependency-groups]
dev = ["respx>=0.21", "pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness_traffic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
