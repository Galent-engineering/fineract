name: harness-build

on:
  workflow_dispatch:
  push:
    branches: [galent/reliability-harness]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.HARNESS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Build Fineract image (jib, amd64)
        run: ./gradlew :fineract-provider:jibDockerBuild -x test --no-daemon

      - name: Tag and push Fineract image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker tag fineract:latest "$REGISTRY/harness/fineract:${GITHUB_SHA}"
          docker tag fineract:latest "$REGISTRY/harness/fineract:latest"
          docker push "$REGISTRY/harness/fineract:${GITHUB_SHA}"
          docker push "$REGISTRY/harness/fineract:latest"

      # deploy/traffic arrives in a later task; skip until it exists.
      - name: Build and push traffic image
        if: hashFiles('deploy/traffic/Dockerfile') != ''
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build -t "$REGISTRY/harness/traffic:${GITHUB_SHA}" -t "$REGISTRY/harness/traffic:latest" deploy/traffic
          docker push "$REGISTRY/harness/traffic:${GITHUB_SHA}"
          docker push "$REGISTRY/harness/traffic:latest"

  deploy:
    needs: build
    if: vars.HARNESS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.HARNESS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Roll services
        run: |
          for svc in fineract traffic; do
            aws ecs update-service --cluster harness --service "$svc" --force-new-deployment >/dev/null
          done
