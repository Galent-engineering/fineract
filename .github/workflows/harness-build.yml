name: harness-build

on:
  workflow_dispatch:
  push:
    branches: [galent/reliability-harness]
    # Docs-only pushes (README-harness.md, other *.md) build and deploy nothing.
    paths:
      - 'deploy/**'
      - 'fineract-*/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradle.properties'
      - 'static-weaving.gradle'
      - 'buildSrc/**'
      - 'custom/**'
      - '.github/workflows/harness-build.yml'

# One run at a time per ref; a queued run waits instead of cancelling the one that is mid-deploy.
concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0 # gradle derives the version from git tags
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.HARNESS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Build Fineract image (jib, amd64)
        run: ./gradlew :fineract-provider:jibDockerBuild -x test --no-daemon

      - name: Tag and push Fineract image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker tag fineract:latest "$REGISTRY/harness/fineract:${GITHUB_SHA}"
          docker tag fineract:latest "$REGISTRY/harness/fineract:latest"
          docker push "$REGISTRY/harness/fineract:${GITHUB_SHA}"
          docker push "$REGISTRY/harness/fineract:latest"

      # One image per push (no provenance/SBOM attestations): the registry keeps one manifest per tag.
      - name: Build and push traffic image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker buildx build --provenance=false --sbom=false --push \
            -t "$REGISTRY/harness/traffic:${GITHUB_SHA}" -t "$REGISTRY/harness/traffic:latest" deploy/traffic

  deploy:
    needs: build
    # Never on pull_request or workflow_dispatch; only a push to the harness branch, and only when enabled.
    if: github.event_name == 'push' && github.ref == 'refs/heads/galent/reliability-harness' && vars.HARNESS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Its OIDC token carries the environment subject, which only harness-github-deploy trusts.
    environment: harness-deploy
    permissions:
      id-token: write
      contents: read
    env:
      FINERACT_TAG: ${{ github.sha }}
      TRAFFIC_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      # Dependencies are installed before any AWS credential exists, and without lifecycle scripts.
      - name: Install CDK app
        working-directory: deploy/cdk
        run: npm ci --ignore-scripts
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.HARNESS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy HarnessApp
        working-directory: deploy/cdk
        env:
          ALLOWED: ${{ secrets.HARNESS_ALLOWED_CIDRS }}
        run: |
          # Secrets are masked by Actions already; mask the value and each entry explicitly too.
          echo "::add-mask::$ALLOWED"
          for c in ${ALLOWED//,/ }; do echo "::add-mask::$c"; done
          npx cdk deploy HarnessApp --exclusively --require-approval never \
            -c "allowedCidrs=$ALLOWED" \
            -c "fineractImageTag=$FINERACT_TAG" \
            -c "trafficImageTag=$TRAFFIC_TAG"
      - name: Wait for services to stabilise
        run: |
          aws ecs wait services-stable --cluster harness --services fineract traffic
